name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          sw_vers

      - name: App bauen
        run: VERSION="0.1.${{ github.run_number }}" scripts/build_app.sh

      - name: Als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: FuFF-Transcribe
          path: build/FuFF-Transcribe.zip

      - name: Release "Neueste Version" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/FuFF-Transcribe.zip \
            --title "FuFF Transcribe – neueste Version (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus dem aktuellen Stand. ZIP laden, entpacken, App in den Programme-Ordner ziehen."
